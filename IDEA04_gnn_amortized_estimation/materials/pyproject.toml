[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-paper-gnn"
version = "0.1.0"
description = "TPC-H relational contribution estimation with RPV-GNN"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
model = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
