version: runtime_limits_v3_3
status: DESIGNED
execution_authorized: false
timing:
  warmup_runs: 1
  measured_runs_minimum: 3
  summary: [median, minimum, maximum]
  components:
    - T_fetch
    - T_build
    - T_prepare
    - T_provenance
    - T_eval
    - T_shapley
    - T_total
    - T_reuse
resources:
  record_peak_rss: true
  record_temporary_disk: true
  record_intermediate_representation_size: true
limits:
  per_condition_timeout_minutes: 15
  timeout_status: TIMEOUT
  memory_limit: environment_budget_not_yet_recorded
policy:
  no_automatic_retry: true
  preserve_stdout_stderr_exit_code: true
  do_not_compare_timing_across_unrecorded_environments: true
